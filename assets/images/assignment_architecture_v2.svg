<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrowb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1240" height="880" fill="#ffffff"/>
  <text x="620" y="38" text-anchor="middle" font-size="23" font-weight="bold" fill="#111827">Inference Speedrun — what talks to what, and what you build</text>

  <!-- ================= LEFT: DEV LOOP ================= -->
  <rect x="22" y="64" width="560" height="716" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="302" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#374151">YOUR DEV MACHINE  (any T4)</text>

  <!-- local test client -->
  <rect x="92" y="116" width="420" height="72" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="302" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">local_test.py  +  bench_client.py</text>
  <text x="302" y="170" text-anchor="middle" font-size="14" fill="#1e3a8a">from the kit — run as-is</text>

  <!-- arrow down -->
  <line x1="302" y1="188" x2="302" y2="246" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="314" y="222" font-size="14" fill="#374151">HTTP + SSE  →  <tspan font-weight="bold">127.0.0.1:$PORT</tspan></text>

  <!-- student server -->
  <rect x="52" y="250" width="500" height="296" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="302" y="280" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">YOUR SERVER — you build all of this</text>
  <rect x="72" y="296" width="460" height="42" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="302" y="322" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#92400e">start_server.sh — yours to rewrite; reads $MODEL_DIR, $PORT</text>

  <!-- inner engine components 2x3 grid, single-line tiles -->
  <g font-size="14.5" font-weight="bold" fill="#92400e">
    <rect x="72"  y="354" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="182" y="381" text-anchor="middle">HTTP / SSE endpoints</text>

    <rect x="312" y="354" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="422" y="381" text-anchor="middle">Scheduler / batching</text>

    <rect x="72"  y="410" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="182" y="437" text-anchor="middle">KV cache + CUDA graphs</text>

    <rect x="312" y="410" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="422" y="437" text-anchor="middle">Quantization + kernels</text>

    <rect x="72"  y="466" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
    <text x="182" y="493" text-anchor="middle">Prefill / attention</text>

    <rect x="312" y="466" width="220" height="44" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" stroke-dasharray="5,3"/>
    <text x="422" y="487" text-anchor="middle">Spec. decoding</text>
    <text x="422" y="504" text-anchor="middle" font-size="12.5" font-weight="normal">(optional)</text>
  </g>
  <text x="302" y="534" text-anchor="middle" font-size="13" fill="#92400e" font-style="italic">any files, any structure — the grader only runs start_server.sh</text>

  <!-- weights cylinders -->
  <g>
    <line x1="182" y1="546" x2="182" y2="596" stroke="#374151" stroke-width="2.5" marker-start="url(#arrow)"/>
    <line x1="422" y1="546" x2="422" y2="596" stroke="#374151" stroke-width="2.5" stroke-dasharray="5,4" marker-start="url(#arrow)"/>

    <path d="M 92 614 a 90 13 0 0 0 180 0 v 60 a 90 13 0 0 1 -180 0 z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <ellipse cx="182" cy="614" rx="90" ry="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="182" y="650" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#374151">Qwen3-4B model</text>
    <text x="182" y="670" text-anchor="middle" font-size="13" fill="#374151">$MODEL_DIR (fixed)</text>

    <path d="M 332 614 a 90 13 0 0 0 180 0 v 60 a 90 13 0 0 1 -180 0 z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
    <ellipse cx="422" cy="614" rx="90" ry="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="422" y="650" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#374151">drafter (optional)</text>
    <text x="422" y="670" text-anchor="middle" font-size="13" fill="#374151">you download from HF</text>
  </g>

  <text x="302" y="726" text-anchor="middle" font-size="14" fill="#374151" font-style="italic">iterate here until local_test.py runs cleanly — then submit</text>

  <!-- ================= CENTER submit arrows ================= -->
  <line x1="582" y1="130" x2="656" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowb)"/>
  <text x="619" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#2563eb">submit</text>
  <text x="619" y="150" text-anchor="middle" font-size="12.5" fill="#2563eb">.tar.gz</text>

  <line x1="656" y1="180" x2="582" y2="180" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowb)"/>
  <text x="619" y="202" text-anchor="middle" font-size="12.5" fill="#2563eb">results</text>

  <!-- ================= RIGHT: GRADING ================= -->
  <rect x="658" y="64" width="560" height="716" rx="10" fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="938" y="96" text-anchor="middle" font-size="18" font-weight="bold" fill="#374151">GRADING</text>

  <!-- dashboard -->
  <rect x="700" y="112" width="476" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="938" y="139" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Course dashboard</text>
  <text x="938" y="161" text-anchor="middle" font-size="13.5" fill="#1e3a8a">upload · queue · leaderboard · run feedback</text>

  <line x1="938" y1="178" x2="938" y2="208" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- modal container -->
  <rect x="678" y="212" width="520" height="540" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="938" y="238" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">T4 grading container — same GPU as your dev box</text>

  <!-- grader process -->
  <rect x="698" y="252" width="480" height="106" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="938" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Grader — the same bench_client.py you have</text>
  <rect x="712" y="290" width="216" height="38" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="820" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#374151">hidden prompts + gate</text>
  <rect x="948" y="290" width="216" height="38" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="1056" y="314" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#374151">baseline run = 1.0×</text>
  <text x="938" y="348" text-anchor="middle" font-size="13" fill="#1e3a8a">score = geomean of three speedups · accuracy gate ≥ 95%</text>

  <!-- bridge arrow -->
  <line x1="938" y1="358" x2="938" y2="408" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="950" y="388" font-size="14" fill="#374151">HTTP, via a unix-socket bridge</text>

  <!-- sandbox -->
  <rect x="698" y="412" width="480" height="180" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="938" y="438" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">SANDBOX — no network</text>

  <rect x="718" y="452" width="440" height="122" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="938" y="480" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">your tarball, extracted</text>
  <text x="938" y="506" text-anchor="middle" font-size="14" fill="#92400e">sh start_server.sh  →  your engine  →  127.0.0.1:$PORT</text>
  <text x="938" y="532" text-anchor="middle" font-size="13.5" fill="#92400e">env set for you:</text>
  <text x="938" y="554" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">MODEL_DIR · PORT · DRAFTER_BYO_DIR</text>

  <!-- cylinders on grading side -->
  <line x1="820" y1="592" x2="820" y2="638" stroke="#374151" stroke-width="2.5" marker-start="url(#arrow)"/>
  <line x1="1056" y1="592" x2="1056" y2="638" stroke="#374151" stroke-width="2.5" stroke-dasharray="5,4" marker-start="url(#arrow)"/>

  <path d="M 735 656 a 85 13 0 0 0 170 0 v 54 a 85 13 0 0 1 -170 0 z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <ellipse cx="820" cy="656" rx="85" ry="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="820" y="690" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#374151">Qwen3-4B model</text>
  <text x="820" y="710" text-anchor="middle" font-size="13" fill="#374151">$MODEL_DIR (fixed)</text>

  <path d="M 971 656 a 85 13 0 0 0 170 0 v 54 a 85 13 0 0 1 -170 0 z" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <ellipse cx="1056" cy="656" rx="85" ry="13" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="1056" y="690" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#374151">your drafter (optional)</text>
  <text x="1056" y="710" text-anchor="middle" font-size="13" fill="#374151">fetched from your HF repo</text>

  <text x="938" y="740" text-anchor="middle" font-size="12.5" fill="#374151">(drafter: declared in manifest.json — weights only, ≤ 2.5 GB)</text>

  <text x="938" y="772" text-anchor="middle" font-size="14" fill="#374151" font-style="italic">same server, same client as your local runs — only the prompts differ</text>

  <!-- ================= LEGEND ================= -->
  <g font-size="14.5">
    <rect x="120" y="806" width="28" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="158" y="822" fill="#111827">yours — build / edit</text>

    <rect x="340" y="806" width="28" height="20" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="378" y="822" fill="#111827">provided — run as-is</text>

    <rect x="570" y="806" width="28" height="20" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <text x="608" y="822" fill="#111827">fixed data</text>

    <rect x="730" y="806" width="28" height="20" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="768" y="822" fill="#111827">optional</text>

    <rect x="880" y="806" width="28" height="20" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="918" y="822" fill="#111827">isolation boundary</text>
  </g>
</svg>
